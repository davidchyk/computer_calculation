<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min-site</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="tabs">
          <button class="tab active">
            <i class="fa-solid fa-f"></i>
            Функции
          </button>
          <button class="tab">
            <i class="fa-solid fa-microchip"></i>
            Машина
          </button>
        </div>
        <div class="icons">
          <i class="fa-solid fa-circle-info">
            <span class="tooltip">Полезная информация о приложении</span>
          </i>
          <i class="fa-solid fa-globe" id="language-toggle">
            <div class="language-dropdown" id="language-dropdown">
              <a href="/Min-site/mainFront/function/index.html">EN</a>
              <a href="/Min-site/LangMode/RU/function/RU.html">RU</a>
              <a href="/Min-site/LangMode/UA/function/UA.html">UA</a>
            </div>
          </i>
          <i class="fa-solid fa-toggle-off"></i>
        </div>
      </nav>
    </header>
    <main>
      <form id="calculation-form">
        <label>
          Количество аргументов
          <input type="text" id="number-of-arg" placeholder="Значение" />
        </label>
        <label>
          Элементарная основа
          <input type="text" id="elemental-basis" placeholder="Значение" />
        </label>
        <div class="input-group">
          <label>
            F1
            <input type="text" id="f1" placeholder="Значение" />
          </label>
          <div class="button-group">
            <button type="button" class="add-field" title="Добавить поле">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="submit-button">Отправить</button>
      </form>
      <div class="loading-indicator">
        <dotlottie-player
          src="https://lottie.host/d850e678-c127-44bd-8a90-9ae39b5d5ac4/gTS8RLMEqe.lottie"
          background="transparent"
          speed="1"
          loop
          autoplay
        ></dotlottie-player>
        <div>Обработка...</div>
      </div>
      <div class="download">
        <a href="#" download>
          Скачать файл решения (.pdf) <i class="fa-solid fa-download"></i>
        </a>
      </div>
    </main>
    <footer>
      <p>Min-site ©2025</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
